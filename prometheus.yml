global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']

  - job_name: 'payment-core-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-core-service:8082']

  - job_name: 'processor-worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['processor-worker:8083']

server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: merchant
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/merchants/**
        - id: payment-core-service
          uri: ${PAYMENT_CORE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/payments,/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@apiKeyResolver}"
        - id: processor-worker
          uri: ${PROCESSOR_WORKER_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/receipts/**

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">Payment Gateway</span>
            <div class="d-flex align-items-center gap-2">
                <span id="navMerchant" class="text-white-50 small d-none"></span>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none" type="button">Sair</button>
            </div>
        </div>
    </nav>

    <main class="container">

        <!-- Autenticação -->
        <div id="authSection" class="row justify-content-center d-none">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <ul class="nav nav-pills nav-fill" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginPane" type="button" role="tab">Entrar</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerPane" type="button" role="tab">Cadastrar</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="loginEmail" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="loginEmail" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="loginPassword" class="form-label">Senha</label>
                                        <input type="password" class="form-control" id="loginPassword" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                                </form>
                            </div>
                            <div class="tab-pane fade" id="registerPane" role="tabpanel">
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label for="regCompany" class="form-label">Empresa</label>
                                        <input type="text" class="form-control" id="regCompany" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="regEmail" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="regEmail" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="regPassword" class="form-label">Senha</label>
                                        <input type="password" class="form-control" id="regPassword" minlength="8" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Criar conta</button>
                                </form>
                            </div>
                        </div>
                        <div id="authAlert" class="alert d-none mt-3 mb-0"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard autenticado -->
        <div id="dashboardSection" class="d-none">
            <div class="row g-4">
                <div class="col-md-5">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white fw-semibold">Nova cobrança</div>
                        <div class="card-body">
                            <form id="paymentForm">
                                <div class="mb-3">
                                    <label for="payMerchantId" class="form-label">Merchant ID (API Key)</label>
                                    <input type="text" class="form-control" id="payMerchantId" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="payAmount" class="form-label">Valor (R$)</label>
                                    <input type="number" step="0.01" min="0.01" class="form-control" id="payAmount" placeholder="200.00" required>
                                </div>
                                <div class="mb-3">
                                    <label for="payMethod" class="form-label">Método</label>
                                    <select class="form-select" id="payMethod">
                                        <option value="PIX">PIX</option>
                                        <option value="CREDIT_CARD">Cartão de crédito</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary w-100" id="payBtn">Processar pagamento</button>
                            </form>
                            <div id="payAlert" class="alert d-none mt-3 mb-0"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white fw-semibold">Transações</div>
                        <div class="card-body">
                            <table class="table table-hover align-middle" id="transactionsTable">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Valor</th>
                                        <th>Método</th>
                                        <th>Status</th>
                                        <th>Data</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="transactionsBody"></tbody>
                            </table>
                            <div id="emptyState" class="text-muted text-center py-4">Nenhuma transação ainda.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

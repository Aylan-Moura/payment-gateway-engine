name: Java CI Pipeline (Payment Gateway Engine)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar o Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes Unitarios (exceto E2E)
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B clean test -pl '!e2e-tests'
          else
            mvn -B clean test -pl '!e2e-tests'
          fi

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar o Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes E2E (Testcontainers)
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B -pl e2e-tests -am test
          else
            mvn -B -pl e2e-tests -am test
          fi

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar o Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-dashboard/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: frontend-dashboard
        run: npm ci

      - name: Build do frontend
        working-directory: frontend-dashboard
        run: npm run build

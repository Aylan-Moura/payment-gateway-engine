name: Java CI Pipeline (Payment Gateway Engine)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar o Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes Automatizados
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B clean test
          else
            mvn -B clean test
          fi

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar o Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-dashboard/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: frontend-dashboard
        run: npm ci

      - name: Build do frontend
        working-directory: frontend-dashboard
        run: npm run build

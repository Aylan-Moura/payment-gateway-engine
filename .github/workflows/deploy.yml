name: Continuous Deployment (Payment Gateway Engine)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-image-tag.outputs.tag }}
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar o Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar a Aplicação
        run: mvn clean compile -DskipTests

      - name: Executar Testes Automatizados
        run: mvn test

      - name: Set Image Tag
        id: set-image-tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build-docker-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: set-image-tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build Docker Images
        run: |
          docker build -t payment-gateway/auth-service:${{ steps.set-image-tag.outputs.tag }} ./auth-service
          docker build -t payment-gateway/payment-core-service:${{ steps.set-image-tag.outputs.tag }} ./payment-core-service
          docker build -t payment-gateway/processor-worker:${{ steps.set-image-tag.outputs.tag }} ./processor-worker
          docker build -t payment-gateway/api-gateway:${{ steps.set-image-tag.outputs.tag }} ./api-gateway

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker Images
        run: |
          docker push payment-gateway/auth-service:${{ steps.set-image-tag.outputs.tag }}
          docker push payment-gateway/payment-core-service:${{ steps.set-image-tag.outputs.tag }}
          docker push payment-gateway/processor-worker:${{ steps.set-image-tag.outputs.tag }}
          docker push payment-gateway/api-gateway:${{ steps.set-image-tag.outputs.tag }}

  deploy:
    needs: build-docker-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: set-image-tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/payment-gateway
            sed -i "s|payment-gateway/auth-service:.*|payment-gateway/auth-service:${{ steps.set-image-tag.outputs.tag }}|g" docker-compose.prod.yml
            sed -i "s|payment-gateway/payment-core-service:.*|payment-gateway/payment-core-service:${{ steps.set-image-tag.outputs.tag }}|g" docker-compose.prod.yml
            sed -i "s|payment-gateway/processor-worker:.*|payment-gateway/processor-worker:${{ steps.set-image-tag.outputs.tag }}|g" docker-compose.prod.yml
            sed -i "s|payment-gateway/api-gateway:.*|payment-gateway/api-gateway:${{ steps.set-image-tag.outputs.tag }}|g" docker-compose.prod.yml
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
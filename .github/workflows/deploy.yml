name: Continuous Deployment (Payment Gateway Engine)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Uma unica tag (SHA do commit) usada por todos os jobs e pelo compose na EC2.
  IMAGE_TAG: ${{ github.sha }}
  # Namespace do Docker Hub (deve ser igual ao DOCKER_HUB_USERNAME).
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar o Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes Automatizados
        run: mvn -B clean test

  build-docker-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: |
          docker build -f auth-service/Dockerfile -t ${IMAGE_NAMESPACE}/auth-service:${IMAGE_TAG} .
          docker build -f payment-core-service/Dockerfile -t ${IMAGE_NAMESPACE}/payment-core-service:${IMAGE_TAG} .
          docker build -f processor-worker/Dockerfile -t ${IMAGE_NAMESPACE}/processor-worker:${IMAGE_TAG} .
          docker build -f api-gateway/Dockerfile -t ${IMAGE_NAMESPACE}/api-gateway:${IMAGE_TAG} .
          docker build -t ${IMAGE_NAMESPACE}/frontend-dashboard:${IMAGE_TAG} ./frontend-dashboard

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker Images
        run: |
          docker push ${IMAGE_NAMESPACE}/auth-service:${IMAGE_TAG}
          docker push ${IMAGE_NAMESPACE}/payment-core-service:${IMAGE_TAG}
          docker push ${IMAGE_NAMESPACE}/processor-worker:${IMAGE_TAG}
          docker push ${IMAGE_NAMESPACE}/api-gateway:${IMAGE_TAG}
          docker push ${IMAGE_NAMESPACE}/frontend-dashboard:${IMAGE_TAG}

  deploy:
    needs: build-docker-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Copiar arquivos de infraestrutura para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,prometheus.yml,grafana/**"
          target: "/opt/payment-gateway"
          overwrite: true

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/payment-gateway
            test -f .env || { echo "Arquivo .env ausente em /opt/payment-gateway"; exit 1; }
            IMAGE_NAMESPACE="${{ env.IMAGE_NAMESPACE }}"
            IMAGE_TAG="${{ env.IMAGE_TAG }}"
            for svc in auth-service payment-core-service processor-worker api-gateway frontend-dashboard; do
              sed -i -E "s|(image: ).*/${svc}:.*|\1${IMAGE_NAMESPACE}/${svc}:${IMAGE_TAG}|" docker-compose.prod.yml
            done
            docker compose -f docker-compose.prod.yml config -q
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps

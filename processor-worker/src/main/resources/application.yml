server:
  port: 8083

spring:
  application:
    name: processor-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_gateway
    username: admin
    password: adminpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_worker
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: adminpassword
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

app:
  webhook:
    # URL usada quando o merchant nao configurou webhook propria.
    # Vazio = nao envia webhook (apenas loga um aviso).
    default-url: ${WEBHOOK_DEFAULT_URL:}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:payment-receipts}
    region: ${AWS_S3_REGION:${AWS_REGION:us-east-1}}
    path-style-access: ${AWS_S3_PATH_STYLE:true}
    endpoint-url: ${AWS_S3_ENDPOINT_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
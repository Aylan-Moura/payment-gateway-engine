server:
  port: 8082

spring:
  application:
    name: payment-core-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_gateway
    username: admin
    password: adminpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_payment
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: adminpassword

app:
  rabbitmq:
    exchange: payment.exchange
    routing-key: payment.created

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always